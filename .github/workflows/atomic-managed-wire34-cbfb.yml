name: Managed Atomic Wire34 CBFB MongoDB
on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "test/indexed-native-mongodb-415", "feat/indexed-int64-tested-49dfe-20261104", "feat/atomic-managed-all-cbfb-20261104", "release/4.5"]
    paths: ["src/**", "packages/backend-mongodb/**", "scripts/qualification/atomic-managed-wire34-cbfb/**", "tests/native/atomic-managed-wire34-cbfb*", "package*.json", ".github/workflows/atomic-managed-wire34-cbfb.yml"]
jobs:
  managed-atomic:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.22.1, 26.4.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: eosrio/hyperion-atomicassets-plugin
          ref: 1bc686bd7ed7d433b2cb7c3a04a762c0c832ad97
          path: out/wire34-managed-inputs/atomic
      - uses: actions/checkout@v4
        with:
          ref: c1b98a52a872b6c070ada32243c8286607e86883
          path: out/wire34-managed-inputs/mixed
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm ci --prefix packages/backend-mongodb --allow-git=all --ignore-scripts=false
      - run: npm ci --allow-git=all
      - run: npm ci --prefix out/wire34-managed-inputs/atomic --allow-git=all
      - run: npm ci --prefix out/wire34-managed-inputs/mixed/packages/backend-mongodb --allow-git=all --ignore-scripts=false
      - run: npm ci --prefix out/wire34-managed-inputs/mixed --allow-git=all
      - run: npm run build
      - run: npm run build --prefix out/wire34-managed-inputs/atomic
      - run: npm run typecheck
      - run: npm run typecheck --prefix out/wire34-managed-inputs/atomic
      - name: Pure actual SDK and emitted managed publication controls
        env:
          HYPERION_ATOMIC_ROOT: ${{ github.workspace }}/out/wire34-managed-inputs/atomic
          HYPERION_MIXED_ROOT: ${{ github.workspace }}/out/wire34-managed-inputs/mixed
        run: node --test tests/native/atomic-managed-wire34-cbfb-contract.test.mjs tests/native/atomic-managed-wire34-cbfb-teardown.test.mjs tests/native/atomic-managed-wire34-cbfb-host-publication.test.mjs tests/native/atomic-managed-wire34-cbfb-result-observer.test.mjs tests/native/atomic-managed-wire34-cbfb-sdk-boundary.test.mjs tests/native/atomic-managed-wire34-cbfb-migration.test.mjs tests/native/wire34-parent-integration.test.mjs
      - name: Owned controlled-source managed Atomic HTTP
        run: node scripts/qualification/atomic-managed-wire34-cbfb/ci.mjs --profile managed-atomic77-hapi-wire34-cbfb-linux-engineering-v1 out/wire34-managed-inputs/atomic out/managed-atomic-wire34-cbfb-${{ matrix.node-version }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-atomic-wire34-cbfb-${{ matrix.node-version }}
          path: out/managed-atomic-wire34-cbfb-${{ matrix.node-version }}
          if-no-files-found: error
