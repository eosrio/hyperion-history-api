name: Build & Test

on:
  push:
    branches: [ "main", "dev", "release/4.5" ]
  workflow_dispatch:
  pull_request:
    branches: ["main", "dev", "release/4.5", "codex/fix-action-abi-epochs", "codex/wire-protocol-host", "codex/protocol-abi-observations", "codex/protocol-abi-coverage", "codex/protocol-abi-frontier", "codex/protocol-abi-consumers", "codex/exact-sequence-history-adapter", "codex/action-source-journal", "codex/portable-state-production", "feat/protocol-action-occurrence-proof", "fix/protocol-source-read-cancellation", "build/native-action-dependencies", "feat/native-observation-prepare", "feat/native-action-authorization", "feat/native-action-consumers", "build/native-wire-profile-pin", "build/bun-1.4.4", "fix/native-wire-worker-proofs", "fix/live-reader-ship-credits", "feat/source-handoff-outcomes", "feat/action-attempt-dispositions", "fix/worker-attempt-quiescence", "fix/stream-client-compatibility-45", "codex/wire-full-worker-replay", "feat/source-bound-attempt-adjudication", "perf/native-wire-worker-profiles", "codex/wire-storage-recovery", "codex/native-source-proof-pair", "feat/original-action-authorization-397", "fix/portable-mapping-retry-eligibility-403", "feat/mongodb-complete-kind-402", "test/wire-mongodb-combined-profile-408", "feat/mongodb-operator-lists-414", "build/wire-mongodb-codec-profile-410", "feat/stateful-indexed-schema-415", "test/indexed-native-mongodb-415", "feat/indexed-int64-tested-49dfe-20261104", "feat/atomic-managed-all-cbfb-20261104"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HYPERION_INDEXED_TEST_PROFILE: cbfb

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HYPERION_NATIVE_SOURCE_PROFILE: stateful-all-cbfb-root-native-wire34-linux-engineering-v1
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.22.1", "26.4.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install the independently pinned CBFB native assembly before root postinstall
        run: npm ci --prefix packages/backend-mongodb --allow-git=all --ignore-scripts=false
      - run: npm ci --allow-git=all
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Verify the pinned checker and embedded TypeScript
        run: |
          test "$(bun --version)" = "$(cat .bun-version)"
          test "$(bun -p process.versions.typescript)" = "$(node -p 'require("./package.json").dependencies.typescript')"
      - run: npm run typecheck
      - run: npm run build
      - name: Record the explicit current Linux assembly and actual runtime candidate
        run: |
          mkdir -p out/wire34-build-source
          node scripts/qualification/wire34-cbfb/source-check.mjs > out/wire34-build-source/current-native-git-${{ matrix.node-version }}.json
          node tests/unit/wire34-cbfb-source-admission.mjs --admit-wire34-cbfb > current-native-source-${{ matrix.node-version }}.json
          node --input-type=module <<'NODE'
          import {copyFileSync} from 'node:fs';
          const exact=process.versions.node,major=exact.split('.')[0];
          copyFileSync(`out/wire34-build-source/current-native-git-${exact}.json`,`current-native-git-${exact}.json`);
          for(const kind of ['git','source'])
            copyFileSync(`current-native-${kind}-${exact}.json`,`current-native-${kind}-${major}.x.json`);
          NODE
      - name: Check explicit current profile, frozen historical predicates and workload boundaries
        run: node --test scripts/qualification/indexed-schema-mongodb/all-cbfb-native-teardown.test.mjs tests/native/wire34-cbfb-caller-routing.test.mjs tests/native/projection-manager-lifecycle.test.mjs tests/native/bounded-json-string-encoding.test.mjs scripts/qualification/operator-list-mongodb/cleanup-source-profile.test.mjs scripts/qualification/wire-source-snapshot.test.mjs
      - name: Check bounded canonical JSON and authentic protocol records on Node ${{ matrix.node-version }}
        run: node --test tests/unit/bounded-json.test.mjs tests/native/bounded-json-protocol-records.test.mjs tests/native/stateful-custody-fractions.test.mjs
      - name: Check all-CBFB stateful source and final publication on Node ${{ matrix.node-version }}
        run: |
          node --test tests/native/pinned-git-source.test.mjs
          node tests/unit/portable-state-owner-v2.mjs
          node tests/unit/stateful-host-native.mjs
      - name: Check retained Wire managed state on Node ${{ matrix.node-version }}
        id: retained_wire_acceptance
        run: node --test tests/unit/wire-managed-state-v2-native.mjs
      - name: Capture retained Wire CPU diagnostics after acceptance failure on Node ${{ matrix.node-version }}
        id: retained_wire_cpu_diagnostic
        if: failure() && !cancelled() && steps.retained_wire_acceptance.outcome == 'failure'
        timeout-minutes: 4
        run: |
          mkdir "$RUNNER_TEMP/retained-wire-cpu"
          node --cpu-prof --cpu-prof-dir="$RUNNER_TEMP/retained-wire-cpu" --test tests/unit/wire-managed-state-v2-native.mjs
      - name: Retain retained Wire CPU samples
        if: always() && steps.retained_wire_acceptance.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: retained-wire-cpu-${{ matrix.node-version }}
          path: ${{ runner.temp }}/retained-wire-cpu/*.cpuprofile
          if-no-files-found: warn
      - name: Check historical Wire source authority on Node ${{ matrix.node-version }}
        run: node --test tests/unit/protocol-abi-history-native.mjs
      - name: Check Fastify request admission and state route compatibility on Node ${{ matrix.node-version }}
        run: node --test --test-timeout=15000 tests/native/fastify-compatibility.test.mjs
      - name: Check complete-kind query/client and final-publication controls
        run: node --test --test-concurrency=1 tests/native/stateful-complete-kind-client.test.mjs tests/native/stateful-complete-kind-host.test.mjs
      - name: Check stream request lifecycle on Node ${{ matrix.node-version }}
        run: node --test tests/native/stream-request-lifecycle.test.mjs tests/native/stream-history-delivery.test.mjs
      - name: Check history/live stream filters and selectors on Node ${{ matrix.node-version }}
        run: node --test tests/native/stream-filter-parity.test.mjs
      - name: Check pinned native stream JSON and credit windows on Node ${{ matrix.node-version }}
        run: node --test tests/native/native-stream-json.test.mjs tests/native/native-stream-credits.test.mjs
      - name: Check trace action serialization on Node ${{ matrix.node-version }}
        run: node --test tests/native/trace-opaque-serialization.test.mjs
      - name: Check explorer system contract metadata on Node ${{ matrix.node-version }}
        run: node --test tests/native/explorer-system-contract.test.mjs
      - name: Check independent reader input pressure on Node ${{ matrix.node-version }}
        run: node --test tests/native/reader-input-pressure.test.mjs tests/native/reader-pressure-observability.test.mjs tests/native/reader-startup-pressure.test.mjs tests/native/live-reader-startup-checkpoint.test.mjs tests/native/reader-pressure-ipc-recovery.test.mjs
      - name: Typecheck Elasticsearch qualification runner
        run: bun check -p scripts/qualification/tsconfig.json
      - name: Check retained Wire source and replay credits with native Node
        run: node --experimental-strip-types scripts/qualification/check-wire-replay-fixture.mjs
      - name: Check coherent Mongo qualification sampling with native Node
        run: |
          node --experimental-strip-types tests/unit/portable-state-mongo-sampling.mjs
          node --experimental-strip-types tests/unit/portable-state-mongo-admission-red.mjs characterize
      - name: Check stateful MongoDB fixture source guards on Node ${{ matrix.node-version }}
        run: node --test scripts/qualification/stateful-mongodb-fixture/offline.test.mjs scripts/qualification/stateful-complete-kind-mongodb/wire34-cbfb-offline.test.mjs
      - name: Check portable state source and fixture ownership guards
        run: python3 tests/fixtures/portable-state-worker/test_helpers.py
      - name: Verify published native Wire CPU evidence
        run: |
          python3 -m unittest discover -s scripts/qualification -p test_native_wire_profile_evidence.py
          python3 scripts/qualification/native-wire-profile-evidence.py verify docs/performance/evidence/native-wire-profile-20261024 --node "$(command -v node)"
          python3 -m unittest discover -s scripts/qualification -p test_native_wire_io_evidence.py
          python3 scripts/qualification/native-wire-io-evidence.py verify docs/performance/evidence/native-wire-io-20261024 --node "$(command -v node)"
      - name: Verify native Wire CPU evidence checksums
        working-directory: docs/performance/evidence/native-wire-profile-20261024
        run: sha256sum -c SHA256SUMS
      - name: Verify native Wire I/O evidence checksums
        working-directory: docs/performance/evidence/native-wire-io-20261024
        run: sha256sum -c SHA256SUMS
      - name: Verify Elasticsearch evidence checksums
        working-directory: docs/performance/evidence/es955-20261018
        run: sha256sum -c SHA256SUMS
      - name: Verify Elasticsearch clock-control evidence checksums
        working-directory: docs/performance/evidence/es955-clock-20261018
        run: sha256sum -c SHA256SUMS
      - name: Verify Elasticsearch failure-recovery evidence checksums
        working-directory: docs/performance/evidence/es955-failures-20261019
        run: sha256sum -c SHA256SUMS
      - name: Verify Elasticsearch replica evidence checksums
        working-directory: docs/performance/evidence/es955-replicas-20261019
        run: sha256sum -c SHA256SUMS
      - name: Verify Elasticsearch worker evidence checksums
        working-directory: docs/performance/evidence/es955-workers-20261019
        run: sha256sum -c SHA256SUMS
      - name: Verify worker review follow-up evidence checksums
        working-directory: docs/performance/evidence/es955-worker-review-20261019
        run: sha256sum -c SHA256SUMS
      - name: Verify reader recovery evidence checksums
        working-directory: docs/performance/evidence/reader-recovery-20261019
        run: sha256sum -c SHA256SUMS
      - name: Verify reader recovery review evidence checksums
        working-directory: docs/performance/evidence/reader-recovery-review-20261019
        run: sha256sum -c SHA256SUMS
      - name: Check disposable replica fixture cleanup with mocked Docker
        shell: pwsh
        run: ./scripts/qualification/check-replica-cleanup.ps1
      - name: Check full-worker fixture cleanup with mocked Docker
        shell: pwsh
        run: ./scripts/qualification/check-worker-cleanup.ps1
      - name: Check worker observation and shutdown
        run: node scripts/qualification/check-worker-observer.mjs
      - name: Check qualification proof and observer I/O accounting
        run: node --test tests/native/portable-worker-proof-metrics.test.mjs tests/native/portable-native-stage-timing.test.mjs tests/native/protocol-index-metadata.test.mjs
      - name: Check complete source sealing with native Node
        run: node --test tests/unit/action-source-seal-native.mjs
      - name: Check bounded full-source read stages on Node ${{ matrix.node-version }}
        run: node --test tests/native/protocol-staged-bundle-read.test.mjs
      - name: Verify Elasticsearch review follow-up evidence checksums
        working-directory: docs/performance/evidence/es955-failure-review-20261019
        run: sha256sum -c SHA256SUMS
      - name: Verify guarded contract replay evidence checksums
        working-directory: docs/performance/evidence/guarded-replay-20261019
        run: sha256sum -c SHA256SUMS
      - name: Retain current assembly and actual Node runtime admission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-native-source-${{ matrix.node-version }}
          path: |
            current-native-source-${{ matrix.node-version }}.json
            current-native-git-${{ matrix.node-version }}.json
            current-native-git-*.x.json
            current-native-source-*.x.json
            out/wire-managed-diagnostic-*/progress.jsonl
          if-no-files-found: error
      - name: Verify action source admission evidence checksums
        working-directory: docs/performance/evidence/action-source-admission-20261020
        run: sha256sum -c SHA256SUMS
      - name: Verify captured Wire worker evidence checksums
        working-directory: docs/performance/evidence/wire-worker-20261020
        run: sha256sum -c SHA256SUMS
      - name: Verify Wire Mongo state write evidence checksums
        working-directory: docs/performance/evidence/wire-state-writes-20261020
        run: sha256sum -c SHA256SUMS
      - name: Verify protocol adapter observation checksum
        working-directory: docs/performance/evidence/protocol-adapter-20261019
        run: sha256sum -c SHA256SUMS
      - name: Verify projection rollback evidence checksums
        working-directory: docs/performance/evidence/projection-rollback-20261021
        run: sha256sum -c SHA256SUMS
      - name: Verify native proof read evidence and diagnostic boundaries
        working-directory: docs/performance/evidence/native-proof-reads-20261022
        run: python3 verify.py
      - run: npm test
      - name: Check the separate normal-installed default716 source assembly
        shell: bash
        run: |
          default_source="$RUNNER_TEMP/hyperion-default716"
          git fetch origin 6021a536c8032bd143171338457e8bfbda5c042b
          git -c core.autocrlf=false worktree add --detach "$default_source" 6021a536c8032bd143171338457e8bfbda5c042b
          cd "$default_source"
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json'));
          pkg.dependencies['@eosrio/hyperion-wire-plugin'] = 'git+https://github.com/eosrio/hyperion-wire-plugin.git#7167659e9c043cb3351074fcacb40200cc57f3a3';
          writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --allow-git=all
          npm ci --allow-git=all
          test "$(git diff --name-only)" = $'package-lock.json\npackage.json'
          export HYPERION_NATIVE_SOURCE_PROFILE=stateful-owner-v2-dd85ee5-7167659-fields-engineering
          node tests/unit/protocol-native-installed.mjs
          node tests/unit/action-source-inventory-native.mjs
          node tests/unit/protocol-native-consumer-worker.mjs
          bun test tests/unit/protocol-selection.test.ts --test-name-pattern 'installed legacy Wire profiles'
      - name: Check ABI/native journals, source bindings and canonical frontier against disposable Elasticsearch 9.5.5
        if: matrix.node-version == '24.22.1'
        run: node scripts/qualification/check-protocol-abi-store.mjs protocol-journals.json
      - name: Retain protocol journal evidence and cleanup result
        if: always() && matrix.node-version == '24.22.1'
        uses: actions/upload-artifact@v4
        with:
          name: protocol-journals-node24
          path: protocol-journals.json
          if-no-files-found: error

  projection-mongodb:
    runs-on: ubuntu-22.04
    env:
      HYPERION_NATIVE_SOURCE_PROFILE: stateful-all-cbfb-root-native-wire34-linux-engineering-v1
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.22.1", "26.4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/backend-mongodb/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install independently packaged MongoDB adapter before root postinstall
        run: npm ci --prefix packages/backend-mongodb --allow-git=all
      - run: npm ci --allow-git=all
      - name: Check and build MongoDB adapter
        run: |
          bun check -p packages/backend-mongodb/tsconfig.json
          npm test --prefix packages/backend-mongodb
      - name: Exercise the portable runtime and adapter against owned MongoDB 8.0.34
        run: |
          mkdir -p out/wire34-projection-source
          node scripts/qualification/wire34-cbfb/source-check.mjs > out/wire34-projection-source/projection-native-git-${{ matrix.node-version }}.json
          node scripts/qualification/check-projection-mongodb-wire34-cbfb.mjs projection-report.json
      - name: Check actual root-client/native-driver command execution and source profile
        run: |
          npm run build
          cp out/wire34-projection-source/projection-native-git-${{ matrix.node-version }}.json projection-native-git-${{ matrix.node-version }}.json
          node --test tests/native/stateful-complete-kind-public-command.test.mjs
      - name: Exercise complete-kind accounting and same-snapshot ownership against a separately owned MongoDB 8.0.34
        run: node scripts/qualification/stateful-complete-kind-mongodb/wire34-cbfb-ci.mjs complete-kind-mongodb-${{ matrix.node-version }}
      - name: Retain complete-kind native traces, terminal logs and verified fixture cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-kind-mongodb-${{ matrix.node-version }}
          path: complete-kind-mongodb-${{ matrix.node-version }}/
          if-no-files-found: error
      - name: Retain portable MongoDB conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-mongodb-${{ matrix.node-version }}
          path: |
            projection-report.json
            projection-native-git-${{ matrix.node-version }}.json
          if-no-files-found: warn

  operator-lists-mongodb:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.22.1", "26.4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/backend-mongodb/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install the exact all-CBFB root and independently receiving native sources
        run: |
          npm ci --prefix packages/backend-mongodb --allow-git=all --ignore-scripts=false
          npm ci --allow-git=all --ignore-scripts=false
      - name: Check and build the new operator-list assembly
        run: |
          test "$(bun --version)" = "$(cat .bun-version)"
          test "$(bun -p process.versions.typescript)" = "$(node -p 'require("./package.json").dependencies.typescript')"
          bun check -p tsconfig.json
          bun check -p packages/backend-mongodb/tsconfig.json
          npm run build
      - name: Check operator-list contracts, native driver preparation and distinct profile guards
        run: >-
          node --test
          packages/backend-mongodb/tests/operator-lists.test.mjs
          packages/backend-mongodb/tests/operator-lists-driver.test.mjs
          packages/backend-mongodb/tests/operator-list-native-snapshot.test.mjs
          packages/backend-mongodb/tests/operator-list-native-cleanup.test.mjs
          scripts/qualification/operator-list-mongodb/wire34-cbfb-offline.test.mjs
          scripts/qualification/operator-list-mongodb/cleanup-trace.test.mjs
          scripts/qualification/operator-list-mongodb/source-profile.test.mjs
          scripts/qualification/operator-list-mongodb/cleanup-source-profile.test.mjs
      - name: Retain exact new source and compiled assembly admission
        run: |
          mkdir -p out/wire34-operator-list-source
          node scripts/qualification/wire34-cbfb/source-check.mjs > out/wire34-operator-list-source/operator-list-native-git-${{ matrix.node-version }}.json
          cp out/wire34-operator-list-source/operator-list-native-git-${{ matrix.node-version }}.json operator-list-native-git-${{ matrix.node-version }}.json
          node scripts/qualification/operator-list-mongodb/wire34-cbfb-source-profile.mjs --diagnostics operator-list-assembly-${{ matrix.node-version }} > operator-list-source-${{ matrix.node-version }}.json
      - name: Exercise operator lists against a separately owned MongoDB 8.0.34
        run: node scripts/qualification/operator-list-mongodb/wire34-cbfb-ci.mjs operator-list-mongodb-${{ matrix.node-version }}
      - name: Retain original list results, traces, terminal logs and owned-fixture cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-list-mongodb-${{ matrix.node-version }}
          path: |
            operator-list-source-${{ matrix.node-version }}.json
            operator-list-native-git-${{ matrix.node-version }}.json
            operator-list-assembly-${{ matrix.node-version }}/
            operator-list-mongodb-${{ matrix.node-version }}/
          if-no-files-found: error

  action-sequences-design:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["24.22.1", "26.4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --prefix packages/backend-mongodb --allow-git=all --ignore-scripts=false
      - run: npm ci --allow-git=all
      - run: npm run build
      - name: Probe gated exact history modules and mixed-history query design with owned Elasticsearch 9.5.5
        run: node scripts/qualification/check-action-sequences.mjs action-sequences-${{ matrix.node }}.json
      - name: Retain design evidence and cleanup result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-sequences-design-${{ matrix.node }}
          path: action-sequences-${{ matrix.node }}.json
          if-no-files-found: error

  action-source-journal:
    runs-on: ubuntu-24.04
    env:
      HYPERION_NATIVE_SOURCE_PROFILE: stateful-all-cbfb-root-native-wire34-linux-engineering-v1
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24.22.1", "26.4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --prefix packages/backend-mongodb --allow-git=all --ignore-scripts=false
      - name: Install root dependencies and build the independently pinned CBFB assembly
        run: |
          npm ci --allow-git=all
          npm run build
      - name: Record explicit current source and actual Node runtime metadata
        run: |
          mkdir -p out/wire34-journal-source
          node scripts/qualification/wire34-cbfb/source-check.mjs > out/wire34-journal-source/journal-native-git-${{ matrix.node }}.json
          cp out/wire34-journal-source/journal-native-git-${{ matrix.node }}.json journal-native-git-${{ matrix.node }}.json
          node tests/unit/wire34-cbfb-source-admission.mjs --admit-wire34-cbfb > journal-native-source-${{ matrix.node }}.json
      - name: Qualify source journal records and two-copy recovery on owned Elasticsearch 9.5.5
        run: node scripts/qualification/check-action-source-journal.mjs action-source-journal-${{ matrix.node }}.json
      - name: Retain source journal evidence and cleanup result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-source-journal-${{ matrix.node }}
          path: action-source-journal-${{ matrix.node }}.json
          if-no-files-found: error
      - name: Retain journal assembly and runtime admission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-native-source-${{ matrix.node }}
          path: |
            journal-native-source-${{ matrix.node }}.json
            journal-native-git-${{ matrix.node }}.json
          if-no-files-found: error

  historical-mixed-cbfb-admission:
    # Retired source-pin check: manual only, see docs/qualification/retired-source-pins.md.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24.22.1", "26.4.0"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1b98a52a872b6c070ada32243c8286607e86883
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: npm ci --prefix packages/backend-mongodb --allow-git=all --ignore-scripts=false
      - run: npm ci --allow-git=all --ignore-scripts=false
      - run: npm run typecheck
      - run: npm run build
      - name: Preserve the actual frozen mixed checkout and every source regression family
        run: |
          test "$(git rev-parse HEAD)" = "c1b98a52a872b6c070ada32243c8286607e86883"
          node tests/unit/current-cbfb-source-admission.mjs --admit-current-cbfb > historical-mixed-cbfb-source.json
          node --test tests/native/current-stateful-source-profile.test.mjs scripts/qualification/indexed-schema-mongodb/current-cbfb-contract.test.mjs tests/native/current-cbfb-codec-profile.test.mjs tests/native/current-cbfb-source-tamper.test.mjs tests/native/current-cbfb-caller-routing.test.mjs tests/native/projection-manager-lifecycle.test.mjs tests/native/bounded-json-string-encoding.test.mjs scripts/qualification/operator-list-mongodb/cleanup-source-profile.test.mjs scripts/qualification/wire-source-snapshot.test.mjs
          node tests/unit/current-cbfb-source-admission-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-mixed-cbfb-admission-${{ matrix.node }}
          path: historical-mixed-cbfb-source.json
          if-no-files-found: error

  historical-sdk49-admission:
    # Retired source-pin check: manual only, see docs/qualification/retired-source-pins.md.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24.22.1", "26.4.0"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e19fc9afc391512ec3ad620a387c41d80982e3d3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: npm ci --prefix packages/backend-mongodb --allow-git=all --ignore-scripts=false
      - run: npm ci --allow-git=all --ignore-scripts=false
      - run: npm run typecheck
      - run: npm run build
      - name: Preserve SDK49 installed-source and all before-effects regression families
        run: |
          node tests/unit/sdk49-indexed-source-admission.mjs --admit-sdk49 > historical-sdk49-source.json
          node --test tests/native/current-stateful-source-profile.test.mjs tests/native/stateful-complete-kind-codec-profile.test.mjs scripts/qualification/wire-source-snapshot.test.mjs
          node tests/unit/stateful-complete-kind-source-admission-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-sdk49-admission-${{ matrix.node }}
          path: historical-sdk49-source.json
          if-no-files-found: error

  es955-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile disposable fixture and check production result consumers
        env:
          ES_IMAGE: docker.elastic.co/elasticsearch/elasticsearch@sha256:c40a1fb2bc6976821e5625d2329992a1e9c29df576e5955fdcba02421abf0d3c
        run: |
          output="$(mktemp -d)"
          for script in build.sh check-late-results.sh
          do
            docker run --rm --network none --cpus 2 --memory 1g \
              --user "$(id -u):$(id -g)" --entrypoint /bin/bash \
              --mount "type=bind,src=$PWD/scripts/qualification/fixture,dst=/fixture,readonly" \
              --mount "type=bind,src=$output,dst=/output" \
              "$ES_IMAGE" "/fixture/$script"
          done
          printf '42d8f960965927ca1a716c900dfe651c2c93412724e320a71e8c72686eac2456  %s\n' "$output/hyperion-qualifier.jar" | sha256sum -c -
